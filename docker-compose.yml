services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buzzd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buzzd}
      POSTGRES_DB: ${POSTGRES_DB:-buzzd}
    # 5432 na hostu vec zauzima lokalni Postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
